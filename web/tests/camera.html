<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Camera viewport verification</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #090d12; }
    body { color: #e8eef5; font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; }
    canvas { display: block; width: 100vw; height: 100vh; }
    #results { position: fixed; left: 8px; top: 8px; max-width: min(680px, calc(100vw - 16px)); max-height: 45vh; overflow: auto; padding: 8px; background: #000b; white-space: pre-wrap; z-index: 2; }
  </style>
</head>
<body>
  <canvas id="viewport"></canvas>
  <pre id="results">running camera verification...</pre>
  <script type="module">
    import { Vector2 } from 'three';
    import { Game } from '../src/game.js';
    import { processPhoto } from '../src/photo/process.js';

    const canvas = document.querySelector('#viewport');
    const output = document.querySelector('#results');
    const checks = [];

    const check = (name, pass, details = '') => {
      checks.push({ name, pass: Boolean(pass), details });
      if (!pass) throw new Error(`${name}${details ? `: ${details}` : ''}`);
    };

    const finitePose = (camera) => [...camera.position.toArray(), ...camera.quaternion.toArray()].every(Number.isFinite);
    const poseDistance = (a, b) => a.position.distanceTo(b.position) + a.quaternion.angleTo(b.quaternion);

    function samplePixels(renderer) {
      const gl = renderer.gl.getContext();
      const size = renderer.gl.getDrawingBufferSize(new Vector2());
      const width = Math.max(1, Math.floor(size.x));
      const height = Math.max(1, Math.floor(size.y));
      const pixels = new Uint8Array(width * height * 4);
      gl.readPixels(0, 0, width, height, gl.RGBA, gl.UNSIGNED_BYTE, pixels);
      const colors = new Set();
      let nonBlack = 0;
      const stride = Math.max(1, Math.floor(Math.sqrt((width * height) / 12000)));
      for (let y = 0; y < height; y += stride) {
        for (let x = 0; x < width; x += stride) {
          const i = (y * width + x) * 4;
          const r = pixels[i], g = pixels[i + 1], b = pixels[i + 2];
          if (r + g + b > 8) nonBlack++;
          if (colors.size < 128) colors.add(`${r},${g},${b}`);
        }
      }
      return { width, height, nonBlack, colors: colors.size };
    }

    async function run() {
      const game = new Game(canvas);
      game.renderer.resize();
      game.begin({ update: () => 0.7 });
      const sceneReports = [];

      for (let scene = 0; scene < 3; scene++) {
        game.switchMode(scene);
        const view = game.mode.view;
        const ids = ['auto', 'cine', 'free', ...view.shots.map((shot) => shot.id)];
        const poses = [];
        let pixels = null;
        for (const id of ids) {
          view.select(id);
          for (let i = 0; i < 30; i++) game._tick(1 / 60);
          const camera = game.mode.kind === 'bike' ? game.mode.st.camera : game.mode.rig.camera;
          check(`${game.mode.kind}:${id}:finite-camera`, finitePose(camera));
          poses.push({ id, position: camera.position.clone(), quaternion: camera.quaternion.clone() });
          pixels = samplePixels(game.renderer);
          check(`${game.mode.kind}:${id}:pixels-readable`, pixels.width > 0 && pixels.height > 0);
          check(`${game.mode.kind}:${id}:pixels-not-black`, pixels.nonBlack > 0, JSON.stringify(pixels));
          check(`${game.mode.kind}:${id}:pixels-have-color`, pixels.colors > 1, JSON.stringify(pixels));
        }
        const changed = poses.slice(1).some((pose) => poseDistance(pose, poses[0]) > 0.01);
        check(`${game.mode.kind}:presets-change-pose`, changed);
        sceneReports.push({ kind: game.mode.kind, views: ids, pixels });
      }

      game.switchMode(0);
      const selected = game.mode.view.shots[0].id;
      game.mode.view.select(selected);
      game.mode.view.setDistance(game.mode.view.controls.minDistance - 1);
      check('bike:setDistance-clamps', game.mode.view.distance >= game.mode.view.controls.minDistance - 1e-4);
      game.switchMode(1);
      game.switchMode(0);
      check('switchMode:restores-camera-id', game.mode.view.id === 'free', `${game.mode.view.id} !== free`);
      game.mode.view.select('free');
      game._tick(1 / 60);
      game.mode.view.setDistance(8);
      game.reset();
      check('reset:preserves-camera-id', game.mode.view.id === 'free');
      check('reset:meters-zero', game.mode.meters === 0, String(game.mode.meters));

      game.switchMode(1);
      const catches = [];
      game.on.caught = () => catches.push(game.mode.hud.caughtCount);
      check('chase:caught-count-starts-zero', game.mode.hud.caughtCount === 0);
      for (let i = 0; i < 220; i++) game.mode.update(0.05, 0, i * 0.05);
      check('chase:caught-count-increments', game.mode.hud.caughtCount === 2);
      check('chase:caught-event-sequence', catches.join(',') === '1,2');
      game.reset();
      check('chase:reset-clears-caught-count', game.mode.hud.caughtCount === 0);
      for (let i = 0; i < 110; i++) game.mode.update(0.05, 0, i * 0.05);
      check('chase:new-round-records-catch', game.mode.hud.caughtCount === 1);
      game.switchMode(0);
      game.switchMode(1);
      check('chase:switch-starts-new-round', game.mode.hud.caughtCount === 0);

      game.source = { update: () => 0 };
      game._tick(0.05);
      game.setPaused(true);
      const pausedTime = game.t;
      const pausedHud = JSON.stringify(game.mode.hud);
      const pausedScroll = game.mode.world.scroll;
      for (let i = 0; i < 60; i++) game._tick(0.05);
      check('pause:holds-simulation-time', game.t === pausedTime);
      check('pause:holds-chase-statistics', JSON.stringify(game.mode.hud) === pausedHud);
      check('pause:holds-world-position', game.mode.world.scroll === pausedScroll);
      check('pause:scene-still-renders', samplePixels(game.renderer).nonBlack > 0);
      const camera = game.mode.rig.camera;
      const pausedPosition = camera.position.clone();
      game.mode.view.select('wide');
      for (let i = 0; i < 20; i++) game._tick(0.05);
      check('pause:manual-camera-still-responds', camera.position.distanceTo(pausedPosition) > 0.1);
      game.mode.view.select('auto');
      game._tick(0.05);
      const aspect = camera.aspect;
      const landscapeDistance = camera.position.distanceTo(game.mode.focus);
      camera.aspect = 0.4;
      game._tick(0.05);
      check('pause:portrait-camera-refits', camera.position.distanceTo(game.mode.focus) > landscapeDistance);
      camera.aspect = aspect;
      game._tick(0.05);
      check('pause:camera-controls-preserve-statistics', JSON.stringify(game.mode.hud) === pausedHud);
      game.reset();
      check('pause:reset-stays-paused', game.paused);
      check('pause:reset-keeps-time', game.t === pausedTime);
      check('pause:reset-positions-wolves-behind-runner', game.mode.world.pack.every(({ wolf }) => wolf.group.position.x < -game.mode.world.gap));
      game.switchMode(0);
      check('pause:switch-stays-paused', game.paused);
      game.setPaused(false);
      game._tick(0.05);
      check('pause:resume-advances-time', game.t > pausedTime && game.t < pausedTime + 0.1);

      game.switchMode(2);
      check('balloon:starts-with-empty-record', game.mode.kind === 'balloon' && game.mode.hud.stars === 0 && game.mode.hud.segments === 0);
      game.source = { update: () => 0.9 };
      for (let i = 0; i < 800; i++) game._tick(0.05);
      const flight = game.mode.flight;
      check('balloon:qualified-reading-climbs', flight.altitude > 8 && flight.altitude <= flight.maxAltitude, String(flight.altitude));
      check('balloon:qualified-reading-collects-rewards', flight.meters >= flight.segmentLength && flight.stars > 0 && flight.segments > 0, JSON.stringify(game.mode.hud));
      const balloonRecord = { meters: flight.meters, stars: flight.stars, segments: flight.segments };
      game.source = { update: () => 0 };
      game.setPaused(true);
      const balloonAltitude = flight.altitude;
      const balloonCamera = game.mode.rig.camera;
      for (let i = 0; i < 60; i++) game._tick(0.05);
      check('balloon:pause-holds-record', flight.meters === balloonRecord.meters && flight.stars === balloonRecord.stars && flight.segments === balloonRecord.segments);
      check('balloon:pause-holds-altitude', flight.altitude === balloonAltitude);
      check('balloon:pause-scene-still-renders', samplePixels(game.renderer).nonBlack > 0);
      const pausedRecord = JSON.stringify(game.mode.hud);
      const visibleClouds = () => game.mode.clouds.filter(({ mesh }) => mesh.visible).length;
      const cloudsBefore = visibleClouds();
      const balloonCameraBefore = balloonCamera.position.clone();
      game.mode.view.select('wide');
      game.mode.settings.cloud = 0.2;
      for (let i = 0; i < 20; i++) game._tick(0.05);
      check('balloon:pause-camera-preset-responds', balloonCamera.position.distanceTo(balloonCameraBefore) > 0.1);
      check('balloon:pause-preserves-flight-record', JSON.stringify(game.mode.hud) === pausedRecord && flight.altitude === balloonAltitude);
      check('balloon:pause-applies-cloud-setting', visibleClouds() < cloudsBefore);
      game.setPaused(false);
      for (let i = 0; i < 700; i++) game._tick(0.05);
      check('balloon:silence-lands-without-losing-record', flight.grounded && flight.meters >= balloonRecord.meters && flight.stars === balloonRecord.stars && flight.segments === balloonRecord.segments, JSON.stringify(game.mode.hud));
      game.setPaused(true);
      game.reset();
      check('balloon:reset-clears-progress-and-stays-paused', game.paused && game.mode.hud.stars === 0 && game.mode.hud.segments === 0 && game.mode.meters === 0);
      game.switchMode(0);
      check('balloon:switch-back-to-bike', game.mode.kind === 'bike');
      game.switchMode(1);
      check('balloon:switch-back-to-chase', game.mode.kind === 'chase');
      const originalPhoto = document.createElement('canvas');
      originalPhoto.width = 320;
      originalPhoto.height = 240;
      const photoContext = originalPhoto.getContext('2d');
      photoContext.fillStyle = '#ef7054';
      photoContext.fillRect(0, 0, 320, 240);
      let processed;
      for (const type of ['image/png', 'image/jpeg', 'image/webp']) {
        const blob = await new Promise((resolve) => originalPhoto.toBlob(resolve, type));
        check(`photo:${type}:encoded`, blob && blob.type === type);
        processed = await processPhoto(blob);
        const sprite = processed.headSprite;
        const pixels = sprite.getContext('2d').getImageData(0, 0, sprite.width, sprite.height).data;
        check(`photo:${type}:processed-size`, sprite.width === 220 && sprite.height === 220);
        check(`photo:${type}:circular-and-visible`, pixels[3] === 0 && pixels[(110 * 220 + 110) * 4 + 3] > 0);
        check(`photo:${type}:main-color`, /^#[0-9a-f]{6}$/.test(processed.mainColor));
      }
      let rejected = false;
      try { await processPhoto(new Blob(['invalid image'], { type: 'image/png' })); }
      catch { rejected = true; }
      check('photo:invalid-image-rejected', rejected);
      const photoCanvas = processed.headSprite;
      game.setPhoto(photoCanvas, processed.mainColor);
      game.switchMode(2);
      check('photo:balloon-badge-visible-and-mapped', game.mode.badge.visible && game.mode.badge.material.map?.image === photoCanvas);
      game.switchMode(0);
      check('photo:bike-flag-visible-and-mapped', game.mode.st.flag.visible && game.mode.st.badge.material.map?.image === photoCanvas);
      game.switchMode(1);
      check('photo:chase-runner-visible-and-mapped', game.mode.world.runner.badge.visible && game.mode.world.runner.badge.material.map?.image === photoCanvas);
      game.clearPhoto();
      check('photo:clear-hides-chase-badge', game.mode.world.runner.badge.visible === false);
      game.switchMode(2);
      check('photo:clear-hides-balloon-badge', game.mode.badge.visible === false);
      game.switchMode(0);
      check('photo:clear-hides-bike-flag', game.mode.st.flag.visible === false);
      game.setPaused(false);

      const result = { passed: true, cases: checks.length, checks, scenes: sceneReports };
      output.textContent = JSON.stringify(result, null, 2);
      document.body.dataset.status = 'passed';
      // Leave the bike scene visible in its first side shot for screenshots.
      game.switchMode(0);
      game.mode.view.select('side');
      for (let i = 0; i < 2; i++) game._tick(1 / 60);
    }

    run().catch((error) => {
      const result = { passed: false, cases: checks.length, checks, error: String(error?.stack || error) };
      output.textContent = JSON.stringify(result, null, 2);
      document.body.dataset.status = 'failed';
      console.error(error);
    });
  </script>
</body>
</html>
